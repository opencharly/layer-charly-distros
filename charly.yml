cachyos-skill:
    skill:
        name: cachyos
        family: distros
        owner: cachyos
        description: |-
            CachyOS base image (docker.io/cachyos/cachyos-v3) — x86_64_v3-optimized Arch
            derivative. Owned by the opencharly/distro-cachyos submodule (box/cachyos);
            consumed by main's versa box via the `cachyos` import namespace.
            MUST be invoked before building, deploying, or troubleshooting cachyos boxes.
        triggers:
            - "CachyOS images / `cachyos*` / `charly-cachyos` workstation profile / `box/cachyos` submodule"
        content: |
            # cachyos
            
            CachyOS base image, pulled from the upstream-published OCI image
            `docker.io/cachyos/cachyos-v3` (optimized for modern `x86_64_v3` CPUs), pinned
            by digest in `box/cachyos/charly.yml` — Docker Hub publishes only a `:latest`
            tag for `cachyos-v3`, so a digest is the most precise pin available.
            CachyOS is an Arch derivative, so it shares the Arch toolchain, `pacman`, and the
            `arch-builder` multi-stage builder.
            
            The CachyOS family lives in the **`opencharly/distro-cachyos`** repo (git submodule at
            **`box/cachyos`**), with the `cachyos` base image **owned there** and its
            boxes discovered as `box/<name>/charly.yml`. It composes the main repo's shared
            candies by `@github` git reference and imports the **`opencharly/distro-arch`** submodule
            under the `arch` namespace (`import: [{arch: …}]`) so it reaches `arch.arch` (the
            `cachyos-pacstrap-builder` base) and `arch.arch-builder` (the cachyos base's
            builder) — one-directional, since arch imports nothing back. Build it
            from the submodule: `charly -C box/cachyos box build cachyos` (or
            `charly --repo opencharly/distro-cachyos box build cachyos`).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | docker.io/cachyos/cachyos-v3 (pinned by digest in charly.yml) |
            | Layers | (none) |
            | Platforms | linux/amd64 |
            | Distro | cachyos, arch |
            | Build | pac |
            | Builders | pixi, npm, cargo, aur → arch-builder |
            | Registry | ghcr.io/opencharly |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            ## main → cachyos coupling
            
            The `cachyos` base and its derived boxes — `versa`, the `openclaw-*` family,
            `githubrunner`, `android-emulator`, `charly-selftest`, and the `selkies-*` GPU
            desktops — all live in the **`opencharly/distro-cachyos`** submodule, discovered as
            `box/<name>/charly.yml` boxes. The main repo imports that submodule under the
            `cachyos` import namespace to reference the relocated boxes from its own
            `check`/`vm`/`local`/`kubernetes`/`android` entities:
            
            ```yaml
            # main charly.yml
            import:
              - cachyos: '@github.com/opencharly/distro-cachyos:<tag>'   # namespaced child import → cachyos.<entry>
            ```
            
            This is a one-directional **main → cachyos** dependency. The submodule, in turn,
            imports the **`opencharly/distro-arch`** submodule under the `arch` namespace (for
            `arch.arch` and the `arch.arch-builder` builder) — also one-directional, since
            arch imports nothing back. The whole import graph is therefore a DAG
            (main → cachyos → arch, plus main → arch directly), with no mutual cycle. When a
            repo is reached via two paths — arch, here, via main → arch and via
            main → cachyos → arch — the loader resolves it to a single materialization **by
            repo identity**, so main's namespace pins win and a stale transitive pin inside a
            published submodule release never drags a divergent snapshot into the load (see
            `/charly-internals:go` "import-namespace loader"). The image DAG
            `versa → cachyos → docker.io/cachyos-v3` is itself acyclic. `versa` lives in the
            same submodule as its `base: cachyos`, so it inherits the cachyos base's
            `distro:`/`build:` values AND its `builder:` map (pixi/npm/cargo/aur →
            `arch.arch-builder`) directly — there is no namespace boundary between them. The
            namespace-relative builder map crosses the boundary once, where the cachyos base
            itself names the qualified `arch.arch-builder` ref.
            
            ## AUR support — full parity with `arch`
            
            CachyOS has the **same AUR capability as the `arch` base**, because it is
            Arch-derived and its `builder.aur` points at the shared `arch-builder` (which
            ships `yay`). Anything that builds on arch builds on cachyos:
            
            - A box based on `cachyos` that needs AUR packages declares
              `build: [pac, aur]` (exactly as an `arch`-based box would — the base itself
              declares only `build: [pac]`, so the consumer opts in). The AUR builder stage
              (`<layer>-aur-build` via `arch-builder`) then compiles the packages and
              `pacman -U`-installs the `.pkg.tar.zst` artifacts. Worked example: the
              `selkies-desktop` box (`base: cachyos.cachyos`, `build: [pac, aur]`) builds
              `google-chrome` (chrome candy) + `wlrctl` (wl-tools candy) from the AUR.
            - Candies author AUR packages under `distro.arch.aur.package` (see
              `/charly-image:layer` "AUR"); the `arch` distro tag is what cachyos boxes match
              (their `distro:` is `[cachyos, arch]`), so the same `distro.arch` sections used
              by every Arch box apply unchanged.
            - The `cachyos` base declares `produce: [pixi, npm, cargo, aur]` (identical to
              `arch`), advertising the same builder-capability profile as every other base
              distro.
            
            There is **no cachyos-specific AUR path** and no cachyos-only builder — AUR on
            cachyos and AUR on arch are the same code path through `arch-builder`.
            
            ## Quick Start
            
            ```bash
            charly -C box/cachyos box build cachyos
            charly shell cachyos -c "pacman --version"
            ```
            
            ## Derived / sibling entries (all in opencharly/distro-cachyos)
            
            - `/charly-distros:cachyos-pacstrap-builder` — privileged pacstrap builder (`base: arch.arch`)
            - `/charly-distros:cachyos-pacstrap` — bootstrap-from-scratch rootfs (builds end-to-end)
            - `/charly-vm:cachyos-bootstrap-vm` — bootstrap VM (`cachyos-vm`) + `check-cachyos-vm` check bed
            - `/charly-local:charly-cachyos` — the operator CachyOS workstation profile
            - `/charly-versa:versa` — CachyOS-rooted notebook/OSM image in this submodule (`base: cachyos`)
            
            ### CachyOS GPU box family
            
            The submodule also carries a CachyOS GPU box family — the Arch/CachyOS siblings
            of the Fedora GPU boxes (which live in `box/fedora`). They build on the
            `cachyos.nvidia` GPU base, which is `cachyos` + `agent-forwarding` + `nvidia` +
            `cuda` (the `nvidia` and `cuda` candies are multi-distro — Fedora rpm + Arch pac —
            so they compose unchanged on CachyOS):
            
            - `cachyos.nvidia` — the GPU base (cachyos + agent-forwarding + nvidia + cuda)
            - `cachyos.python-ml` — ML Python environment
            - `cachyos.jupyter-ml` — CUDA ML JupyterLab
            - `cachyos.ollama` — Ollama LLM server
            - `cachyos.comfyui` — ComfyUI image generation
            - `cachyos.unsloth-studio` — Unsloth Studio fine-tuning UI
            - `cachyos.immich-ml` — Immich with the CUDA ML backend
            - `cachyos.selkies-labwc-nvidia` — GPU NVENC Selkies streaming desktop (labwc flavor)
            - `cachyos.selkies-kde-nvidia` — GPU NVENC Selkies streaming desktop (full KDE Plasma flavor)
            - `cachyos.selkies-kde` — full KDE Plasma Selkies flavor on the plain cachyos base (VAAPI on an AMD/Intel render node, software x264 otherwise; the `-nvidia` sibling adds NVENC). The labwc cpu/amd flavor (`selkies-labwc`) lives in this same `box/cachyos` submodule.
            
            ## Why Docker Hub instead of pacstrap
            
            The canonical base pulls the upstream OCI image (the path the CachyOS project
            itself recommends — see https://github.com/CachyOS/docker). It's the faster
            default (no privileged pacstrap, no kernel build). The pacstrap-from-scratch
            variant (`/charly-distros:cachyos-pacstrap`) is retained for offline/air-gapped
            builds and also builds end-to-end (the pacstrap renderer derives
            `[options] Architecture` from the cachyos-v3 microarch repos and emits per-repo
            `SigLevel`).
            
            ## Verification
            
            After `charly -C box/cachyos box build cachyos`:
            - `charly box list` — box appears
            - `charly shell cachyos -c "pacman --version"` — pacman available
            - `charly box inspect versa --format base` (from main) → `cachyos.cachyos` (the `cachyos` import namespace resolves)
            - `charly check box cachyos` — build-scope check: 3 probes pass (os-release `ID=cachyos`,
              `pacman --version`, `pacman-conf --repo-list` contains `cachyos-v3`). These also
              pass when `cachyos` is built from main via the `cachyos` import namespace, and are
              inherited by `versa` through the base chain.
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the cachyos base image, the
            opencharly/distro-cachyos submodule, or the main → cachyos import-namespace coupling.
            Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-distros:arch` — the Arch base (`cachyos-pacstrap-builder` is `base: arch.arch`, via the `arch` import namespace)
            - `/charly-image:image` — box family umbrella (composition, build/validate/inspect)
            - `/charly-internals:cutover-policy` — the hard-cutover policy governing submodule splits

debian-skill:
    skill:
        name: debian
        family: distros
        owner: debian
        description: |-
            Base Debian 13 trixie image. Root of the box hierarchy for Debian builds
            that run as uid 1000 `user` (create mode — Debian 13 ships no pre-existing
            uid-1000 account). Owned by the opencharly/distro-debian submodule (box/debian);
            consumed by no main-repo box.
            MUST be invoked before building, deploying, configuring, or troubleshooting
            any Debian-based box.
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"
        content: |
            # debian
            
            Base Debian 13 (trixie) image. Root of the Debian box hierarchy.
            
            The Debian family lives in the **`opencharly/distro-debian`** repo (git submodule at
            **`box/debian`**). The `debian` base is **owned there** (in that repo's
            `charly.yml`) and composes the main repo's candies by git reference; the
            `debian` distro config, the `deb` format, and the `debootstrap` builder
            template come from charly's embedded build vocabulary. Build it from the submodule:
            `charly -C box/debian box build debian` (or `charly --repo opencharly/distro-debian box build debian`).
            Ubuntu — the deb-family sibling — lives in its own **`opencharly/distro-ubuntu`** repo
            (see `/charly-distros:ubuntu`). Nothing in main consumes any Debian box, so there
            is **no main ↔ debian coupling**.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `debian:13` |
            | Pkg | `deb` |
            | Distro tags | `["debian:13", "debian"]` |
            | Layers | (none — base image only) |
            | Platforms | `linux/amd64` |
            | User | `user` / uid 1000 (**create mode**) |
            | Home | `/home/user` |
            | Registry | `ghcr.io/opencharly` |
            
            ## User model — create, not adopt
            
            The embedded `distro.debian` vocabulary **does not** declare a `base_user:` block, because the upstream `debian:13` base image ships no pre-existing uid-1000 account. `user_policy: auto` (the default for any downstream image) falls through to create mode — the generator emits an idempotent user creation (`useradd` where shadow-utils is present, busybox `adduser` otherwise) during bootstrap.
            
            This is the intentional asymmetry vs `/charly-distros:ubuntu`, which DOES ship `ubuntu:ubuntu` at uid 1000 and declares `base_user:` to adopt that identity. See `/charly-image:image` "user_policy" and `/charly-build:build` "base_user" for the full decision table.
            
            If you build a downstream image on `debian:13-cloud` (or a similar variant that ships a pre-existing `debian` account), override this by adding a `base_user:` block in your project's `build.yml` override.
            
            ## Bootstrap
            
            ```dockerfile
            FROM debian:13
            RUN --mount=type=cache,dst=/var/cache/apt,sharing=locked
                --mount=type=cache,dst=/var/lib/apt,sharing=locked
                apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg && \
                ... install go-task binary ...
            RUN if ! getent passwd 1000 >/dev/null 2>&1; then
                  LOGIN_SHELL=/bin/sh; [ -x /bin/bash ] && LOGIN_SHELL=/bin/bash;
                  if command -v useradd >/dev/null 2>&1; then
                    (getent group 1000 >/dev/null 2>&1 || groupadd -g 1000 user) &&
                    useradd -m -u 1000 -g 1000 -s "$LOGIN_SHELL" user;
                  else
                    (getent group 1000 >/dev/null 2>&1 || addgroup -g 1000 user) &&
                    adduser -D -h /home/user -u 1000 -G user -s "$LOGIN_SHELL" user;
                  fi;
                fi
            WORKDIR /home/user
            USER 1000
            ```
            
            `gnupg` is in the bootstrap package set because downstream candies with `deb.repos[].key` (GitHub CLI, Docker, Kubernetes, Tailscale, Microsoft) call `gpg --dearmor` to convert ASCII-armored keys into `/etc/apt/keyrings/<name>.gpg`. Without `gnupg` the apt-repo stages fail with `gpg: not found`.
            
            ## Downstream / sibling entries (all in opencharly/distro-debian)
            
            - `/charly-distros:debian-builder` — pixi/npm/cargo multi-stage builder on this base.
            - `/charly-coder:debian-coder` — kitchen-sink dev box on this base.
            - `/charly-distros:debian-debootstrap-builder` — privileged debootstrap builder (`base: debian:13`).
            - `/charly-distros:debian-debootstrap` — bootstrap-from-scratch rootfs (`from: builder:debootstrap`).
            - `/charly-vm:debian-debootstrap-vm` — the `debian-debootstrap` bootstrap VM + `check-debian-debootstrap-vm` bed.
            
            ## Verification
            
            ```bash
            charly -C box/debian box build debian
            charly shell debian                       # drops into /home/user as uid 1000
            id                                    # uid=1000(user) gid=1000(user)
            charly -C box/debian box validate     # embedded build vocab + remote layer refs resolve
            ```
            
            ## Related boxes
            
            - `/charly-distros:ubuntu` — deb-family sibling base in the separate `opencharly/distro-ubuntu` submodule; ships `base_user:` + adopts ubuntu:ubuntu.
            - `/charly-distros:debian-builder` — multi-stage builder on top of this box.
            - `/charly-coder:debian-coder` — kitchen-sink dev box on this base.
            - `/charly-distros:fedora` — RPM-family counterpart.
            - `/charly-distros:arch` — pacman-family counterpart (separate `opencharly/distro-arch` submodule).
            
            ## Related commands
            
            - `/charly-build:build` — `base_user:` declaration format + bootstrap packages.
            - `/charly-image:image` — `user_policy:` reconciliation.
            - `/charly-build:generate` — writeBootstrap emission.
            
            ## When to use this skill
            
            **MUST be invoked** when:
            
            - Building or troubleshooting the `debian` base image.
            - Adding any deb-family box that inherits from `debian` (not `ubuntu`).
            - Debugging uid-1000 user issues on a Debian-based box — the answer is almost always "create mode fires, user named `user`."

ubuntu-skill:
    skill:
        name: ubuntu
        family: distros
        owner: ubuntu
        description: |-
            Base Ubuntu 24.04 noble image. Root of the box hierarchy for Ubuntu-
            based builds. Runs as uid 1000 `ubuntu` via ADOPT mode — the upstream
            ubuntu:24.04 base image ships a pre-existing ubuntu:ubuntu account,
            and the embedded distro.ubuntu vocabulary declares base_user to adopt it verbatim.
            MUST be invoked before building, deploying, configuring, or troubleshooting
            any Ubuntu-based box.
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
        content: |
            # ubuntu
            
            Base Ubuntu 24.04 (noble) image. Distinguished from `/charly-distros:debian` by **adopt mode**: the upstream `ubuntu:24.04` base image ships a pre-existing `ubuntu:ubuntu` account at uid 1000, and the embedded `distro.ubuntu` vocabulary declares `base_user:` so the `charly` generator honors that account rather than creating a new one.
            
            The Ubuntu family lives in its own **`opencharly/distro-ubuntu`** repo (git submodule
            at **`box/ubuntu`**) — a SEPARATE repo from `opencharly/distro-debian` (Debian and
            Ubuntu each have their own repo). The `ubuntu` base is **owned there** and
            composes the main repo's candies by git reference plus the embedded build vocabulary. Because
            `distro.ubuntu` is `inherits: debian`, the embedded build vocabulary (which
            carries BOTH distro configs) resolves the inheritance — `opencharly/distro-ubuntu`
            needs no reference to `opencharly/distro-debian`. Build from the submodule:
            `charly -C box/ubuntu box build ubuntu` (or `charly --repo opencharly/distro-ubuntu box build ubuntu`).
            Nothing in main consumes any Ubuntu box, so there is **no main ↔ ubuntu coupling**.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `ubuntu:24.04` |
            | Pkg | `deb` |
            | Distro tags | `["ubuntu:24.04", "ubuntu"]` (symmetric with a `target: vm` deploy's `distroTagChain`; NO `debian` fallback — every deb-family layer carries an explicit `ubuntu` section, and the cascade would otherwise UNION debian-only packages onto ubuntu) |
            | Layers | (none — base image only) |
            | Platforms | `linux/amd64` |
            | User | `ubuntu` / uid 1000 (**adopt mode**) |
            | Home | `/home/ubuntu` |
            | Registry | `ghcr.io/opencharly` |
            
            ## User model — adopt from base image
            
            The embedded `distro.ubuntu` vocabulary inherits from `distro.debian` (same apt bootstrap template) and adds a `base_user:` block:
            
            ```yaml
            distro:
              ubuntu:
                inherits: debian
                base_user:
                  name: ubuntu
                  uid: 1000
                  gid: 1000
                  home: /home/ubuntu
            ```
            
            Any downstream image with `user_policy: auto` (the default) that **did not** explicitly set its own `user:` field will adopt this — `resolved.User = "ubuntu"`, `resolved.Home = "/home/ubuntu"`, `resolved.UserAdopted = true`. The bootstrap emits **no** `useradd`; it emits a one-line comment documenting the adoption:
            
            ```
            # User ubuntu (uid=1000) adopted from base image (declared in charly/charly.yml distro.base_user) — no useradd needed
            WORKDIR /home/ubuntu
            USER 1000
            ```
            
            This architecture is **declarative** (what the base image ships) + **policy-driven** (how to reconcile with the image's configured user). Three policy values:
            
            | Policy | Behavior on this base |
            |--------|----------------------|
            | `auto` (default) | Adopt `ubuntu:ubuntu` — image inherits the upstream account. |
            | `adopt` | Same as auto here; hard-errors on bases without `base_user:`. |
            | `create` | Override — force-create a different uid-1000 account (fails if `useradd` collides). |
            
            See `/charly-image:image` "user_policy" and `/charly-build:build` "base_user" for the full table covering all four distros.
            
            ## Why adopt over rename?
            
            Adopt mode honors the existing `ubuntu` account rather than renaming it to `user` via `usermod -l`, because:
            
            1. Ubuntu's cloud-init tooling, docs, and `/etc/passwd` metadata assume the account is named `ubuntu`.
            2. Renaming is an invisible base-image mutation — breaks in hard-to-debug ways.
            3. The rename approach doesn't scale to Debian cloud images (or future distros) that ship their own pre-existing uid-1000 accounts with different names.
            
            Adopt mode respects the base image's contract and scales declaratively. See `/charly-coder:sshd` for the `getent passwd 1000` pattern that makes candy content (sudoers in particular) work uniformly across both create and adopt modes.
            
            ## Bootstrap
            
            ```dockerfile
            FROM ubuntu:24.04
            RUN --mount=type=cache,dst=/var/cache/apt,sharing=locked
                --mount=type=cache,dst=/var/lib/apt,sharing=locked
                apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg && \
                ... install go-task binary ...
            # User ubuntu (uid=1000) adopted from base image (declared in charly/charly.yml distro.base_user) — no useradd needed
            WORKDIR /home/ubuntu
            USER 1000
            ```
            
            ## Dockerhub rate-limit caveat
            
            The upstream `ubuntu:24.04` pull from Dockerhub is unauthenticated-rate-limited (100 pulls / 6h / IP). If `charly box build ubuntu` fails with `toomanyrequests`, pull from AWS ECR Public and retag:
            
            ```bash
            podman pull public.ecr.aws/docker/library/ubuntu:24.04
            podman tag public.ecr.aws/docker/library/ubuntu:24.04 docker.io/library/ubuntu:24.04
            charly box build ubuntu
            ```
            
            ECR Public mirrors the Dockerhub library namespace without rate-limiting.
            
            ## Downstream / sibling entries (all in opencharly/distro-ubuntu)
            
            - `/charly-distros:ubuntu-builder` — pixi/npm/cargo multi-stage builder.
            - `/charly-coder:ubuntu-coder` — kitchen-sink dev box.
            - `/charly-distros:ubuntu-debootstrap-builder` — privileged debootstrap builder (`base: debian:13`).
            - `/charly-distros:ubuntu-debootstrap` — bootstrap-from-scratch rootfs.
            - `/charly-vm:ubuntu-debootstrap-vm` — the `ubuntu-debootstrap` bootstrap VM + `check-ubuntu-debootstrap-vm` bed.
            
            ## Verification
            
            ```bash
            charly -C box/ubuntu box build ubuntu
            charly shell ubuntu                       # drops into /home/ubuntu as uid 1000
            id                                    # uid=1000(ubuntu) gid=1000(ubuntu)
            charly -C box/ubuntu box validate     # the embedded build vocabulary resolves distro.ubuntu (inherits debian)
            ```
            
            ## Related boxes
            
            - `/charly-distros:debian` — sibling deb-family base without adopt mode (Debian 13 ships no pre-existing uid-1000 user).
            - `/charly-distros:ubuntu-builder` — multi-stage builder.
            - `/charly-coder:ubuntu-coder` — kitchen-sink dev box.
            - `/charly-distros:fedora` — RPM-family counterpart.
            - `/charly-distros:arch` — pacman-family counterpart.
            
            ## Related commands
            
            - `/charly-build:build` — `base_user:` declaration format, which lives in the embedded `distro.ubuntu` vocabulary.
            - `/charly-image:image` — `user_policy:` field + reconciliation.
            - `/charly-build:generate` — adopt-vs-create writeBootstrap emission.
            
            ## Related candies (cross-distro patterns this base enables)
            
            - `/charly-coder:sshd` — `getent passwd 1000`-based sudoers works for both `user` (create) and `ubuntu` (adopt).
            - `/charly-coder:language-runtimes` — Microsoft `dotnet-install.sh` (Ubuntu noble doesn't ship dotnet-sdk-9.0 in main; Microsoft's noble apt repo only has 10.0; the dotnet-install.sh `--channel 9.0` is the cross-distro solution).
            
            ## When to use this skill
            
            **MUST be invoked** when:
            
            - Building or troubleshooting the `ubuntu` base image.
            - Adding any Ubuntu-based box (it will inherit the adopt-mode `ubuntu:ubuntu` identity by default).
            - Debugging `${USER}` / `${HOME}` differences between Ubuntu and other deb-based boxes (ubuntu-coder → `ubuntu:/home/ubuntu`; debian-coder → `user:/home/user`).
            - Understanding why ubuntu-coder's `/etc/sudoers.d/charly-user` says `ubuntu ALL=(ALL) NOPASSWD: ALL` rather than `user`.

