            | Base | `arch.arch` |
            | Layers | `layer-omarchy-base/candy/omarchy-base` |
            | Platforms | linux/amd64 (the `[omarchy]` repo publishes no aarch64 tree) |
            | Distro | `[omarchy, arch]` — the tag chain |
            | Build | pac (no AUR builder: all 23 Omarchy-built packages come from `[omarchy]`) |

            ## The three things that make this image different from Arch

            **1. Every package comes from Omarchy's frozen mirror.** `core`, `extra` and
            `multilib` resolve to `stable-mirror.omarchy.org`, not to Arch upstream — the
            snapshot is deliberately older, and a guest built against Arch would silently
            carry a different kernel and a different everything-else than Omarchy ships.
            `pacman-conf --repo core Server` reporting an `omarchy.org` host is the check
            that catches it.

            **2. It reports `ID=omarchy`.** `omarchy-settings` REPLACES `/etc/os-release`,
            so the built image is `ID=omarchy`, `ID_LIKE=arch`, `VERSION_ID=4.x`. That is
            why omarchy needs its own `#DistroID` rather than an alias of arch — charly's
            host detection reads that field — while `ID_LIKE=arch` makes the arch fallback
            work automatically.

            **3. The limine alpm hooks are withheld, not masked.** `omarchy` hard-depends on
            `limine`, `limine-mkinitcpio-hook`, `limine-snapper-sync`, `snapper` and `sddm`,
            so a container installs the whole boot/DM stack whether it wants it or not.
            Their hooks cannot succeed with no mounted ESP. Pacman's `NoExtract` keeps the
            hook FILES off the image entirely — masking cannot, because
            `90-mkinitcpio-install.hook` is package-owned and pre-masking it aborts the
            transaction with a file conflict.

            > ⚠️ `NoExtract` applies to every LATER transaction too. A machine image that
            > wants those hooks back (for kernel updates to regenerate boot entries) must
            > strip the five rules AND reinstall the affected packages — the hook files are
            > withheld, not merely disabled.

            ## Quick Start

            ```bash
            charly -C box/omarchy box build omarchy
            charly -C box/omarchy check run check-omarchy-pod
            ```

            ## Derived Boxes

            - `omarchy-cstream` — the streamed desktop (see `/charly-distros:omarchy-cstream`)
            - `omarchy-pacstrap-builder` — the privileged builder for bootstrap VMs

            ## Verification

            - `charly -C box/omarchy check box omarchy` — build-scope probes
            - `charly -C box/omarchy check run check-omarchy-pod` — the `disposable: true`
              R10 bed: mirror provenance, the locally-signed packaging key, the withheld
              hooks, and `/etc/skel` seeded into the image user's home

            ## When to Use This Skill

            **MUST be invoked** when the task involves the Omarchy base image, the
            `opencharly/distro-omarchy` submodule, or the main → omarchy import namespace.
            Invoke this skill BEFORE reading source code or launching Explore agents.

            ## Related

            - `/charly-distros:arch` — the Arch base this derives from
            - `/charly-vm:omarchy-vm` — the ISO-installed VM
            - `/charly-image:image` — box family umbrella

omarchy-cstream-skill:
    skill:
        name: omarchy-cstream
        family: distros
        owner: omarchy
        description: |-
            The Omarchy desktop, streamed to a browser — Hyprland with its Quickshell
            shell (the cstream transport spine). Covers why cstream and NOT selkies
            (the wl_compositor v6 constraint), why it bases on omarchy rather than
            composing omarchy-base, and the beds that gate it. MUST be invoked before
            building, deploying or troubleshooting the omarchy-cstream box.
        triggers:
            - "omarchy-cstream / the streamed Omarchy desktop / pod-cstream / layer-cstream-desktop / Hyprland-over-HTTPS"
        content: |
            # omarchy-cstream

            The Omarchy desktop, streamed to a browser — Hyprland with its Quickshell
            shell. The GUI edition of the Omarchy image family: the base image plus the
            cstream transport spine, a nested Hyprland, and Omarchy's own shell,
            terminal, themes and fonts. What a user gets is the real Omarchy desktop —
            the Quickshell bar, notifier, launcher and OSD from /usr/share/omarchy/shell
            — reachable over HTTPS instead of over a monitor cable.

            ## Why cstream and NOT selkies

            charly has two pod-GUI stacks and they are not interchangeable. Selkies
            (pixelflux) hosts labwc and KDE. It CANNOT host Hyprland, and the reason is
            a protocol version, not a missing GPU:

            ```text
            wl_registry#2: error 0: invalid version for global wl_compositor (2):
            expected at most 5, got 6
            terminate called after throwing an instance of 'std::runtime_error'
              what():  CBackend::create() failed!
            ```

            Hyprland binds wl_compositor at v6; pixelflux advertises at most v5. No env
            knob, device mapping or render node fixes that. pod-hyprland's own
            description records the same constraint from the other side — the parent
            must advertise zwp_linux_dmabuf_v1 AND bind xdg_wm_base at version 6, and
            gst-wayland-display (Smithay) is what clears both. layer-cstream-desktop is
            that parent plus the compositor, composed as one name.

            ## Why it BASES on omarchy rather than composing omarchy-base

            omarchy-repo repoints pacman at Omarchy's frozen mirror snapshot, and that
            only governs candies ordered after it. A `require:` cannot be added to
            somebody else's layer, so composing omarchy-base as a peer candy let
            layer-gst-wayland-display and pod-cstream install gstreamer 1.28.6-3 from
            UPSTREAM Arch first; pod-cstream's own gst-plugins-good then resolved to the
            snapshot's 1.28.6-2 and the transaction died outright with
            `installing gstreamer (1.28.6-2) breaks dependency 'gstreamer=1.28.6-3'`.
            Deriving FROM the base image puts the repository configuration in the FROM
            layer, where every later package in every later candy inherits it.

            ## Verification

            - `charly -C box/omarchy check box omarchy-cstream` — build-scope probes
            - The streamed desktop bed: the nested Hyprland + Quickshell shell reachable
              over HTTPS (the check-cstream-* beds)

            ## When to Use This Skill

            **MUST be invoked** when the task involves the omarchy-cstream box, the
            streamed Omarchy desktop, or the cstream transport spine.

            ## Related

            - /charly-distros:omarchy — the base image this derives from
            - /charly-vm:omarchy-vm — the ISO-installed VM
            - /charly-check:quickshell — the shell IPC verb the desktop asserts through
